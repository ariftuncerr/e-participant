name: CI   # Workflow ismi: CI (Continuous Integration)

on:
  push:
    branches: [ "main","develop" ]   # master branch'e push yapıldığında tetiklenir
  pull_request:
    branches: [ "main","develop" ]   # master branch'e PR açıldığında tetiklenir
  workflow_dispatch:        # Manuel olarak çalıştırılabilsin diye

jobs:
	#build çalışır
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Gradle Build
        run: ./gradlew assembleDebug --stacktrace
        
    lint:   # 1. Job: Kod üzerinde Lint kontrolü yapılır
      runs-on: ubuntu-latest
    steps:
      - name: Checkout
	      uses: actions/checkout@v4   # Repo kodunu indir

      - name: Upload html test report
        uses: actions/upload-artifact@v2
        with:
          name: lint.html
          path: app/build/reports/lint-results-debug.html  # Lint raporunu artifact olarak yükle

  unit-test:   # 2. Job: Unit testler çalıştırılır
    needs: [lint]   # Lint job’ı bittikten sonra çalışır
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Run tests
        run: ./gradlew test   # Unit testleri Gradle ile çalıştır

      - name: Upload test report
        uses: actions/upload-artifact@v2
        with:
          name: unit_test_report
          path: app/build/reports/tests/testDebugUnitTest/  # Test sonuçlarını artifact olarak kaydet

  instrumentation-test:   # 3. Job: Android cihaz/emülatör üzerinde UI testleri (Espresso) çalıştırılır
    needs: [unit-test]
    runs-on: macos-latest   # Android emulator için genelde macOS veya Linux kullanılır
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Run espresso tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: ./gradlew connectedCheck   # UI testlerini çalıştır

      - name: Upload test report
        uses: actions/upload-artifact@v2
        with:
          name: instrumentation_test_report
          path: app/build/reports/androidTests/connected/  # Instrumentation test raporu

  static-code-analysis:   # 4. Job: Kod kalitesi analizi (SonarCloud)
    needs: [instrumentation-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11   # Sonar için Java 11 gerekli olabilir

      - name: SonarCloud Scan
        run: ./gradlew app:sonarqube -Dsonar.login=${{ secrets.SONAR_TOKEN }}  # Sonar analizi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:   # 5. Job: APK oluşturma
    needs: [static-code-analysis]
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8   # APK build için Java 8 kullanılıyor

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace   # Debug APK’yı üret

      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: expense-manager.apk
          path: app/build/outputs/apk/debug/app-debug.apk   # Oluşturulan APK’yı artifact olarak kaydet
